# Config variant "c_acb" - laid over config/station.toml by mauer.config.load(variant="c_acb"); tools: --variant c_acb.
# Arrays of tables ([[wall.legs]]) replace the main config's array, tables are merged key by key (mauer.config.merge).
# The C of 2026-10-07 (commits 2b2e698, 1989788): the free ends of A and C lined up - A (5) and C (5) run through
# their corners, B (7) butts against both and is built LAST (build order A, C, B) as the closure of every course.
# Samuel 2026-10-07 kept it as a variant with its own sim + video; the main config builds A -> B -> C (A 5 1/2).

# Legs of the C (robodk/wallplan.py legs / butt_corner, tools/plan_layout.py). Wall frame = leg A frame, y towards
# ARES. ARES works INSIDE the C (Samuel 2026-10-06) and never turns there: it drives in through the open side facing
# leg B (heading 0 in the wall frame) and builds A on its RIGHT (side wall), B in FRONT, C on its LEFT (side wall),
# then backs out (also for every station trip). Every next leg is perpendicular at the far end of the one before, on
# its ARES side, with a vertical BUTT joint in every course (the 53 x 100.5 mm pin pattern is not square: a stone
# turned by 90 deg never engages the sockets below): one leg runs through the corner (its course-0 end flush with the
# BODY of the other leg's outer face), the other leg's flat end face stands rib_mm + corner_gap_mm off its ribbed face
# (wallplan.butt_corner towards_ares). Since 2026-10-07 (Samuel: "the ends of the walls should line up") A and C run
# through and B butts against both: corner A-B frame = T_wall_A @ transl(length * n0_A - width / 2, +(width / 2 +
# rib_mm + corner_gap_mm), 0) @ rotz(+90 deg) (through="prev"); corner B-C frame = T_wall_B @ transl(length * n0_B +
# width / 2 + rib_mm + corner_gap_mm, -width / 2, 0) @ rotz(+90 deg) (through="next").
# Lengths (Samuel 2026-10-06: "2m, then 1.5 across and 1m back"; 2026-10-07: A = C = 5, ends lined up): A 5, B 7,
# C 5 stones; 1.65 m over the outer faces of A and C, 1.41 m between their inside faces (was 1.52 / 1.28 m with C
# butting against B; ARES is 0.6 m wide, 1.12 m long - with the wall in front of ARES it did not fit, study 2026-10-06). side / dist: on which side of ARES the leg is built and ARES centre -> leg centreline
# (RoboDK reach table per side; side walls at 580 mm = ARES side 110 mm from the board plates, like the front at 840).
# ARES stops only where it keeps [routes] clearance_mm from the other legs and their plates (tools/make_job.py
# stop_limits: on B 460..820 mm). Status: lengths, inside and the sides CONFIRMED (Samuel), corner design and the
# distances ASSUMPTION.
[[wall.legs]]
name = "A"
n0 = 5                      # CONFIRMED: Samuel 2026-10-07 (the C's legs A and C the same length as the shorter one,
                            # C; was 10 = "one length is 2m", 2026-10-06)
xyz_in_wall = [0.0, 0.0, 0.0]          # ASSUMPTION: leg A frame = wall frame (definition)
rpy_in_wall_deg = [0.0, 0.0, 0.0]
side = "right"              # CONFIRMED: Samuel 2026-10-06 (wall on the side of ARES inside the C)
dist = 580.0                # ASSUMPTION: ARES side 110 mm from the board plates (170 mm from the leg centreline)
[[wall.legs]]
name = "B"
n0 = 7                      # CONFIRMED: Samuel 2026-10-06 ("1.5 across"; between A and C since 2026-10-07: 1.65 m over
                            # the outer faces of A and C). Built LAST (A, C, B) and CLOSES between A and C in every
                            # course: its last stone drops into a slot with 2 x corner_gap_mm play - the 7 stones' length
                            # tolerance must fit into it (risk accepted by Samuel 2026-10-07; alternatives offered: B
                            # through and built first, or A -> B -> C with the ends 123 mm apart)
xyz_in_wall = [940.0, 62.69, 0.0]      # ASSUMPTION: butt corner at A's far end towards ARES (200 * 5 - 60, 60 + 1.69 + 1.0)
rpy_in_wall_deg = [0.0, 0.0, 90.0]
side = "front"              # CONFIRMED: Samuel 2026-10-06 (B straight ahead of ARES driving into the C)
dist = 840.0                # CONFIRMED: Samuel 2026-10-06 (front wall 840 mm, see [wall] dist_nominal)
[[wall.legs]]
name = "C"
n0 = 5                      # CONFIRMED: Samuel 2026-10-06 ("1m back")
runs_through = true         # CONFIRMED: Samuel 2026-10-07 ("the ends of the walls should line up"): C runs through its
                            # corner with B (wallplan.butt_corner through="next"); without the key the earlier leg does
xyz_in_wall = [1000.0, 1525.38, 0.0]   # ASSUMPTION (corner_gap_mm): beyond B's end, free end at x = 0 like A's start:
                            # B + (60, 200 * 7 + 60 + 1.69 + 1.0)
rpy_in_wall_deg = [0.0, 0.0, 180.0]
side = "left"               # CONFIRMED: Samuel 2026-10-06 (wall on the side of ARES inside the C)
dist = 580.0                # ASSUMPTION: as leg A

# Board places: the main config's of 2026-10-07 (W0-W6), which this variant used until the main config became the
# C with a door and a window (2026-10-08) - kept here (same as config/variants/c_a55.toml).
# C layout A 5 / B 7 / C 5 (2026-10-07, tools/plan_layout.py --evaluate --legs 5,7,5; the L layout of 2026-10-05 in
# tests/conftest.py L_BOARDS): 7 of the 8 existing boards (Samuel: no new markers / boards; the engraved "u = ..." on
# the plates is wrong, the names/ids are what count; W7 (ids 100-109) stays a spare - with A at 5 stones no further
# plate fits without overlapping its neighbour) on the INSIDE faces of the legs (ARES side), no spare block, plates
# clear of each other, the other legs, ARES at its stops and the routes. A stop only looks at boards of its OWN leg,
# with looks clear of the wall built by the end of the stop, of the ARES chassis and of a full magazine
# (tools/make_job.py, mauer.armcheck): A 2 boards, B 3, C 2 -> 2, 3, 3, 2 usable boards at the 4 stops (+-50 mm
# ARES margin and the arrival standoff), worst baseline 600 mm. Boards of legs B / C are in their leg frame, so they
# follow the corner offsets (rib + corner gap).
[[targets]]
name = "W0"
parent = "wall"
leg = "A"           # block k = 0 of leg A (u 100)
first_id = 30
xyz = [60.0, 147.0, 4.1]
rpy_deg = [180.0, 0.0, 0.0]
