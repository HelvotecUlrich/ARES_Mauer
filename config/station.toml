# ARES routes of the L (mauer/floor.py, tools/make_job.py): leg change and station trips as explicit waypoint lists in
# the wall frame, one translation OR one rotation per PLC command. Checked against the full legs, floor plates, spare
# blocks and the station table with the chassis footprint [ares] length x width; a rotation sweeps the circle of the
# half diagonal (635 mm). Floor plates count as obstacles although they are only 4 mm high (wheels must not run over
# them).
