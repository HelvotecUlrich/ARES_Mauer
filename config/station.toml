# ARES + UR5 brick laying – station parameters (single source for all RoboDK scripts).
# Units: mm, deg. Frame "ARES" = base_link of the MA repo: floor, midpoint between the two steering axes,
# x forward, y left, z up (REP-103). The STEP export 2026-09-23 uses exactly this frame (checked: steering
# mounting plates at x = ±353.6, front scanner at (452.0, 192.0) = ares_geometry.yaml lidar_front).
#
# Status tags:  CONFIRMED = CAD / Samuel / measurement · ASSUMPTION = reasonable choice, no evidence ·
#               PLACEHOLDER = only so the model is valid, must be replaced

[ares]
step_file = "cad/2026-09-23_030718_A_1-AMR_SIM.stp"   # CONFIRMED: NX export 2026-09-23 (Samuel), frame = base_link
steer_axis_x = 353.625      # CONFIRMED: steering axes at ±353.625 mm (PLC FB_AmrKinematics, NX-MCD 2026-09-22)
deck_top_z = 333.6          # CONFIRMED from STEP placement of 030250 Deckplatte (z axis down) – check with ray in RoboDK
length = 1120.0             # CONFIRMED: chassis mesh x ±560 (MCD export 2026-09-22)
width = 600.0               # CONFIRMED: chassis mesh y ±300

[ur5]
robot_file = "robodk/library/UR5.robot"   # RoboDK library, UR5 (CB3), downloaded 2026-10-02
# Mount: "in axis with the front steering module, on top of the robot" (Samuel 2026-10-02).
mount_x = 353.625           # CONFIRMED (axis of the front steering module); exact position follows (Samuel)
mount_y = 0.0               # ASSUMPTION: on the centreline
mount_z = 333.6             # PLACEHOLDER: deck top, no adapter plate; exact height follows (Samuel)
mount_rz = 0.0              # PLACEHOLDER: rotation of the UR base about z [deg]

[tool]
# Gripper "Backengreifer" (Festo EHPS-20-A + ribbed jaws) taken from Gino's RoboDK station UR5_sim_v3.rdk (2026-10-02).
# Tool frame: z along the flange axis, y = closing direction of the jaws, TCP = top centre of the held stone.
tool_file = "cad/gripper_backengreifer_gino.tool"
tcp_z = 135.0               # Gino UR5_sim_v3.rdk (older UR5_sim.rdk / test.urp: 155). ASSUMPTION: TCP = stone top
                            # centre; without Bota SensONE (+35 mm if it is mounted between flange and gripper)

[brick]
# Full stone "Kompletter_Stein" (CAD 2026-10-01, cad/stone_full_2026-10-01.step): CONFIRMED from CAD.
mesh = "cad/stone_full_2026-10-01.stl"   # stone frame: x 0..120 (width, ribbed faces), y -200..0 (length), z 0..120
length = 200.0
width = 120.0
height = 120.0              # course pitch, assuming the pins seat fully (CAD: pins 23.5 mm, sockets 22.5 mm deep -> check)
pin_length = 23.5
head_joint = 0.0            # dry-stacked, interlocking
bed_joint = 0.0
mass_kg = 0.0               # UNKNOWN: volume 2270 cm3 (CAD); concrete ~2.3 g/cm3 would give ~5.2 kg > UR5 payload 5 kg

[wall]
side = "front"              # Samuel 2026-10-02: wall on the short (front) edge of ARES, ARES moves sideways (+y)
courses = 3                 # PLACEHOLDER: number of courses
bond_offset = 0.5           # running bond, half a stone (100 mm) = pin spacing of the stone
base_z = 20.0               # PLACEHOLDER: first course stands on a 20 mm base plate with sockets (the existing plates
                            # are for the older 144 mm stone)
dist_nominal = 740.0        # from reach study 2026-10-02 (front): 8 stones/course/stop, 120 mm gap front edge – wall face
u_from = -900.0             # nominal wall drawn along the wall, wall frame [mm] – station view only
u_to = 1800.0

[deck]
holder_z = 20.0             # PLACEHOLDER: stones on the deck stand in a 20 mm holder with sockets
layers = 2                  # PLACEHOLDER: stacked layers in the magazine (reach_study.py deck grid)
magazine_rows_dx = [-653.6, -433.6]  # ASSUMPTION: magazine rows, x relative to the UR base [mm] (robodk/simulate.py:36)
magazine_y = [-205.0, 0.0, 205.0]    # ASSUMPTION: stone centres along ARES y [mm] (robodk/simulate.py:37)
magazine_layers = 3         # ASSUMPTION: layers per magazine stack as simulated (robodk/simulate.py:36; differs
                            # from layers = 2 above, which only drives the reach-study grid)

[camera]
# Eye-in-hand camera on the tool flange beside the gripper, looking along the tool z axis (Samuel 2026-10-02). It
# looks at markers to reference (1) the place positions at the wall and (2) the fixed pick-up station where ARES reloads
# its deck magazine when empty – ARES alone is not accurate enough (drive error, wheel slip). Not modelled in RoboDK yet.
# Sources: IDS shop / 1stVision IDS uEye manual (GigE uEye CP Rev. 2.2) / INOSAKI lens pages, read 2026-10-02.
model = "IDS GV-51F0CP-M-GL Rev.2.2"  # CONFIRMED: Samuel 2026-10-02; Sony IMX547, mono, global shutter, GigE, C-mount
res_x = 2472                # CONFIRMED datasheet [px]
res_y = 2064                # CONFIRMED datasheet [px]
pixel_um = 2.74             # CONFIRMED datasheet [µm] -> active area 6.77 × 5.66 mm, diagonal 8.82 mm
body = [29.0, 29.0, 29.0]   # CONFIRMED datasheet: housing W × H × D [mm], IP30; mass not in the datasheets read
power_max_w = 4.2           # CONFIRMED datasheet (1.5–4.2 W). Supply: PoE (IEEE 802.3af/at) OR 12–24 V DC on the 8-pin
                            # Hirose HR25 (pin 8 VCC, pin 1 GND) – never both at once (IDS: can destroy the camera)
lens = "IDS-12M23-C1228"    # CONFIRMED: Samuel 2026-10-02; 2/3" image circle, 12 MP, F2.8–16, no IR correction,
                            # Ø29 × 47.6 mm, 90 g (IDS shop listing); chosen over IDS-8M118-C1220 (same 12 mm, 1/1.8")
focal = 12.0                # CONFIRMED datasheet [mm] -> field of view 31.5° × 26.5° on this sensor
lens_mod = 80.0             # CONFIRMED datasheet: minimal object distance [mm]
working_dist = 320.0        # ASSUMPTION: lens -> marker [mm]; 181 × 151 mm field, 0.073 mm/px; focus + iris fixed and
                            # locked (F5.6–8), changing them = new hand-eye calibration
power = "UR tool connector, 24 V"  # ASSUMPTION (recommendation 2026-10-02): max 600 mA (UR5 manual 1.9.4), camera
                            # ≈ 0.18 A at 24 V. The gripper EHPS-20-A (max 2 A at 24 V) cannot run from it.
ip = "192.168.50.10"        # PLACEHOLDER: persistent camera IP (set once with ids_ipconfig) in its own subnet on a
                            # dedicated laptop NIC; must not collide with the ARES subnets 192.168.1/24, 192.168.200/24,
                            # 169.254/16 (MA 10_robot/ipc_c6030/IP_CONFIG_erwan.md). As delivered the camera answers at
                            # 192.168.0.1 (IDS peak enumeration 2026-10-05) -> not openable until the IP is set
serial = "4110073444"       # CONFIRMED: IDS peak 26.06.2 enumeration 2026-10-05, the only IDS camera attached (model
                            # string "GV-51FxCP-M", MAC 00:1B:A2:21:21:13) – check against the camera label
cti_path = ""               # "" = GENICAM_GENTL64_PATH, then the IDS install folder; on this laptop (CONFIRMED
                            # 2026-10-05): C:\Program Files\IDS\ids_peak\ids_gevgentl\64\ids_gevgentlk.cti
timeout_ms = 3000           # ASSUMPTION: grab timeout after the software trigger (exposure + ~45 ms GigE transfer)
packet_size = "auto"        # ASSUMPTION: "auto" keeps the size the IDS GenTL negotiated (largest the network supports),
                            # "max" = camera maximum (only if the NIC jumbo size is >= it), or a value in bytes
n_buffers = 3               # ASSUMPTION: acquisition buffers (software trigger, one frame at a time)
load_default_userset = true # ASSUMPTION: load the camera user set "Default" on open (known state), then apply the above
pixel_format = "Mono8"      # ASSUMPTION: 5.1 MB per frame, ~45 ms on GigE, enough for the marker work
exposure_us = 5000.0        # PLACEHOLDER: set at the first test with the real light (the arm stands still)
gain = 1.0                  # PLACEHOLDER
settle_s = 2.0              # PLACEHOLDER: wait after the arm stops before the image – Heini thesis needed 2 s for a
                            # vibrating mount; ARES sway on the sprung casters not measured yet

[camera.mount]
# T_flange_cam: camera frame (OpenCV: z = optical axis, x = image right, y = image down, origin = projection centre) in
# the UR5 flange frame. PLACEHOLDER until the bracket exists – used only for planning and simulation; the real value
# is measured by the hand-eye calibration (calib/handeye.json). RoboDK occlusion survey 2026-10-05: put the camera
# >= ~150 mm off the flange axis on the flange -x side (jaw closing direction), never on ±y (held stone fills the view).
xyz = [-150.0, 0.0, 60.0]
rpy_deg = [0.0, 0.0, 0.0]

[vision]
# Free OpenCV pipeline (no HALCON): ChArUco boards, solvePnP (IPPE + LM refine), cv2.calibrateHandEye (PARK).
opencv = "4.14.0.94"        # CONFIRMED pin (research 2026-10-05): 5.0.0.93 has no calibrateHandEye in Python,
                            # <= 4.13 shifts ChArUco corners by 0.5 px
intrinsics_file = "calib/camera_intrinsics.json"
handeye_file = "calib/handeye.json"
min_corners = 8             # ASSUMPTION: minimum ChArUco corners for a board pose
max_reproj_px = 1.0         # ASSUMPTION: reject a board pose with a larger RMS reprojection error
border_px = 10              # ASSUMPTION: ignore corners closer to the image border (partial-tag outliers)
calib_min_corners = 12      # ASSUMPTION: minimum ChArUco corners per intrinsics view
holdout_every = 5           # ASSUMPTION: hand-eye validation holds out every 5th pose (research: 5–10 hold-out poses)
max_qd_rad_s = 0.01         # ASSUMPTION: drop images taken while a joint moved faster (0.01 rad/s · 10 ms · 1 m = 0.1 mm)

[vision.handeye_plan]
# Look poses around the deck-fixed calib board (research 2026-10-05: >= 20 poses, large relative rotations).
n_poses = 25                # ASSUMPTION
dist_mm = [290.0, 355.0]    # ASSUMPTION: inside the depth of field around the 320 mm focus distance
tilt_deg = [15.0, 30.0]     # ASSUMPTION
roll_deg = [-90.0, 90.0]    # ASSUMPTION
min_clearance_mm = 50.0     # ASSUMPTION: plan warns when arm/camera points come closer to the deck plane (rough DH check)

# ChArUco boards. Board frame = OpenCV 4.14 CharucoBoard frame: origin at the top-left outer corner of the printed
# board, x to the right, y down, z into the board (checked 2026-10-05: corner 0 at (square, square, 0)).
# tools/print_targets.py prints origin and axes on every sheet. Print as vector PDF at 100 % on a rigid flat plate,
# then measure the square size over the whole board and enter it (0.1 % scale error = 0.32 mm depth at 320 mm).
[boards.calib]
# Intrinsics and hand-eye board; fixed on the ARES deck for the hand-eye calibration so ARES sway cancels out.
squares_x = 11
squares_y = 8
square_mm = 15.0            # PLACEHOLDER: nominal, replace with the measured print size
marker_mm = 11.0            # PLACEHOLDER: nominal
dictionary = "DICT_5X5_100"
first_id = 0
xyz = [-232.5, 60.0, 336.6] # PLACEHOLDER: board origin in the ARES frame during the hand-eye calibration (face up,
rpy_deg = [180.0, 0.0, 0.0] # centre at ARES x = -150, y = 0, on a 3 mm plate on the deck, 504 mm behind the UR axis:
                            # 100 % of 250 planned look poses have a UR5 IK solution vs 94 % at x = 0 (calib_handeye
                            # scan 2026-10-05). Lies on magazine row 1 -> calibrate with an empty magazine

[boards.ref]
# Reference boards at the wall and the pick-up station: 10 AprilTag markers each, own id range per board
# (targets.first_id). Research 2026-10-05 (synthetic): lateral ~0.03 mm, tilt <= 0.06°, yaw <= 0.003°.
squares_x = 5
squares_y = 4
square_mm = 16.0            # PLACEHOLDER: nominal, replace with the measured print size
marker_mm = 12.0            # PLACEHOLDER: nominal
dictionary = "DICT_APRILTAG_36h11"

# Reference board placements: board origin and orientation in the parent frame. parent = "wall" (wall frame,
# robodk/rdk_common.py), "station" ([pickup_station] frame) or "deck" (ARES frame).
# PLACEHOLDER layout: wall boards face up on the floor in the 120 mm gap between the ARES front edge and the wall
# face, centred at wall y = 120 mm, every 700 mm along the wall, so every stop sees at least two (heading from the
# baseline). Whether they are reachable and stay visible as the wall grows: robodk/look_study.py.
[[targets]]
name = "W0"
parent = "wall"
first_id = 30
xyz = [-40.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W1"
parent = "wall"
first_id = 40
xyz = [660.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W2"
parent = "wall"
first_id = 50
xyz = [1360.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W3"
parent = "wall"
first_id = 60
xyz = [2060.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W4"
parent = "wall"
first_id = 70
xyz = [2760.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W5"
parent = "wall"
first_id = 80
xyz = [3460.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W6"
parent = "wall"
first_id = 90
xyz = [4160.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W7"
parent = "wall"
first_id = 100
xyz = [4860.0, 152.0, 3.0]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "S0"
parent = "station"
first_id = 200
xyz = [100.0, 100.0, 3.0]   # PLACEHOLDER: face up on the station table
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "S1"
parent = "station"
first_id = 210
xyz = [700.0, 100.0, 3.0]   # PLACEHOLDER
rpy_deg = [180.0, 0.0, 0.0]

[pickup_station]
# Fixed pick-up station where ARES reloads its deck magazine when it is empty (Samuel 2026-10-02). Layout unknown –
# everything here is a PLACEHOLDER so planning and simulation can run.
# Station frame: origin at the front-left corner of the table top, x along the front edge, y away from ARES, z up.
xyz_in_wall = [-1500.0, 1500.0, 0.0]   # PLACEHOLDER: station frame in the wall frame (z = floor level)
rpy_in_wall_deg = [0.0, 0.0, 0.0]      # PLACEHOLDER
table_z = 400.0             # PLACEHOLDER: table top above the floor [mm]
ares_xyz = [400.0, -800.0, 0.0]        # PLACEHOLDER: ARES base_link in the station frame when docked
ares_rpy_deg = [0.0, 0.0, 90.0]        # PLACEHOLDER: ARES x (forward) towards the table (+y station)
slot_rows = 2               # PLACEHOLDER: stones standing upright in a holder grid on the table
slot_cols = 6
slot_pitch_x = 260.0        # PLACEHOLDER: along x (stone length 200 + jaw clearance)
slot_pitch_y = 200.0        # PLACEHOLDER: along y (stone width 120 + jaw clearance)
slot_origin = [150.0, 250.0]  # PLACEHOLDER: centre of slot (0, 0) in the station frame [mm]
holder_z = 0.0              # PLACEHOLDER: stones stand directly on the table top

[ur]
# UR5 CB3 link from the laptop (research 2026-10-05, tested against URSim CB3 3.15.8): RTDE (official UR client,
# BSD-3, vendored in mauer/ur/rtde) streams the state at 125 Hz; one URScript `def` program per step over port 30002
# with start/done markers in RTDE output registers; Dashboard Server for power, brakes and protective stops.
host = ""                   # PLACEHOLDER: UR5 IP (PolyScope > Setup Robot > Network) – not known yet
dashboard_port = 29999      # CONFIRMED: UR Dashboard Server
script_port = 30002         # CONFIRMED: secondary client interface (URScript)
rtde_port = 30004           # CONFIRMED: RTDE
rtde_hz = 125.0             # CONFIRMED: CB3 RTDE maximum frequency
reg_started = 24            # CONFIRMED range: output_int_register 24..47 belongs to RTDE (0..23 fieldbus)
reg_done = 25
reg_error = 26              # ASSUMPTION: output_int_register for block error codes (0 none, 1 IK unreachable)
contact_mm = 60.0           # ASSUMPTION: last/first mm at the stone moved at v_contact (= robodk/motion.py engage)
abort_decel = 1.2           # ASSUMPTION: stopl deceleration for an abort [m/s²] (URScript movel default)
block_start_timeout_s = 3.0 # ASSUMPTION: no start marker within this time = compile error (check PolyScope log)
do_grip_close = 1           # PLACEHOLDER: Gino's code pulses standard DO1 to close, DO0 to open; real wiring open
do_grip_open = 0            # PLACEHOLDER
grip_pulse_s = 0.5          # PLACEHOLDER
grip_wait_s = 1.0           # PLACEHOLDER: EHPS-20-A stroke time not looked up
payload_tool_kg = 0.0       # PLACEHOLDER: gripper + adapter + camera + bracket; 0 = unknown -> real runs refuse to start
payload_cog_mm = [0.0, 0.0, 60.0]  # PLACEHOLDER: centre of gravity in the flange frame
v_joint = 0.5               # ASSUMPTION: rad/s, conservative first-run value
a_joint = 0.5               # ASSUMPTION: rad/s²
v_lin = 0.10                # ASSUMPTION: m/s, free Cartesian moves
a_lin = 0.30                # ASSUMPTION: m/s²
v_contact = 0.02            # ASSUMPTION: m/s, last approach to / retract from the stone
park_q_deg = [21.34, -127.66, 20.7, 16.96, -90.0, 21.34]  # ASSUMPTION: IK of the robodk/simulate.py:280 compact start
                            # pose (TCP 300 mm ahead of the UR base, z 917.1 mm ARES, tool down); not collision-checked
sim_payload_kg = 1.0        # ASSUMPTION: URSim/simulation ONLY while payload_tool_kg is unknown; never on the real robot

[ares_ads]
# ARES relative move over ADS (PLC v2.9, HMI interface v2; MA 10_robot/hmi/SPEC_2026-09-25_Relativfahrt_HMI_SPS_v2.md).
# Operating pattern A (proven in E003, MA 10_robot/tools/imu_cal_run.py): amr_hmi v2 stays open and owns heartbeat,
# MANUAL and HALT; the sequencer writes only the fMove* fields, nMoveCmdId, bCmdMoveStart and bCmdMoveAbort.
ams_net_id = "192.168.1.10.1.1"   # CONFIRMED: MA 10_robot/hmi/amr_hmi/config.yaml
host_ip = "192.168.1.10"          # CONFIRMED: same file
port = 851                        # CONFIRMED: TwinCAT PLC runtime 1
timeout_ms = 1000                 # CONFIRMED: amr_hmi value
speed_mms = 150.0                 # CONFIRMED: value used in E003 (01.10.2026); PLC clamps to 5..500 mm/s
accel_mms2 = 200.0                # CONFIRMED: value used in E003; PLC clamps to 20..1000 mm/s²
min_if_version = 2                # CONFIRMED: stFromPlc.nIfVersion of PLC v2.x
min_plc_build = "2.1"             # CONFIRMED: +Y = left verified with PLC v2.1 (28.09.2026); v2.0 mirrored (MA D21)
rot_speed_degs = 10.0             # CONFIRMED: E003 rotations at 10 deg/s (MA tools/imu_cal_run.py), amr_hmi default
ack_timeout_s = 2.0               # ASSUMPTION: PLC acks in the cycle of the start edge; covers the 1 s ADS timeout
deadline_margin_s = 15.0          # ASSUMPTION: client deadline = PLC timeout 2(d/v+v/a)+10 s + tAbortMax 10 s + this

[study]
# Reach study grid. Wall frame: x along the wall (ARES travel direction), y towards ARES, origin on the wall centreline.
wall_dist_min = 640.0       # ARES centre -> wall centreline [mm]; 640 = front edge 560 + half stone 60 + 20 clearance
wall_dist_max = 1140.0
wall_dist_step = 25.0
u_min = -1000.0             # positions along the wall [mm]
u_max = 1000.0
u_step = 10.0
approach = 150.0            # vertical approach / retract height above the place pose [mm] (> pin length 23.5)
check_collisions = true     # RoboDK collision check for reachable poses (slower)

[sequencer]
# Closed-loop stop sequencing (mauer/sequencer.py). All ASSUMPTION first-run values, to be tuned on the robot.
rotate_threshold_deg = 0.5  # heading error that triggers a rotation: 2.5x the PLC minimum 0.2°, ~3.5 sigma of the
                            # E003 rotation scatter 0.14°
rotate_keep_dir_deg = 150.0 # larger rotations keep the previous direction (E003: ~1.2° loss after reversing)
stop_tol_mm = 20.0          # ARES position error at a stop that triggers a correction move
max_corrections = 2         # correction moves per arrival (stop or dock)
max_correction_mm = 100.0   # cap of (closed-loop move - nominal move)
max_jump_mm = 50.0          # measured vs predicted ARES pose at the wall beyond this -> stop
max_jump_deg = 3.0
station_max_jump_mm = 100.0 # at the station and right after a station trip (station location is a PLACEHOLDER)
station_max_jump_deg = 5.0
max_fit_rms_mm = 1.0        # corner residual RMS of the frame fit beyond this -> pause
dock_tol_mm = 30.0          # dock position error that triggers a correction move
require_all_boards = true   # every expected board of a look must be measured
