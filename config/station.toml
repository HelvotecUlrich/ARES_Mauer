search_mm = 2500.0          # ASSUMPTION: search area around start and goal

[ur]
# UR5 CB3 link from the laptop (research 2026-10-05, tested against URSim CB3 3.15.8): RTDE (official UR client,
# BSD-3, vendored in mauer/ur/rtde) streams the state at 125 Hz; one URScript `def` program per step over port 30002
# with start/done markers in RTDE output registers; Dashboard Server for power, brakes and protective stops.
host = "192.168.56.101"     # CONFIRMED 2026-10-06 (table test, lab switch): Dashboard + RTDE answer. The lab's UR5
                            # runs PolyScope 3.3.3.292: RTDE protocol v1 only (vendored client patched, see its
                            # README), no tcp_offset field, output_int_register 24..47 do not exist. A set_tcp of a
                            # block stays active after the block (probe 2026-10-06). get_inverse_kin_has_solution does
                            # NOT exist (compile error) - every IK-guarded block (look_pose, pick/place, plan --check)
                            # fails on this robot until mauer/ur/script.py ik_guard has a 3.3 variant; get_inverse_kin
                            # itself works and raises a runtime error (program stops, no motion) for an unreachable
                            # pose. tools/calib_handeye.py orbit needs neither (movel relative to the start)
dashboard_port = 29999      # CONFIRMED: UR Dashboard Server
script_port = 30002         # CONFIRMED: secondary client interface (URScript)
rtde_port = 30004           # CONFIRMED: RTDE
rtde_hz = 125.0             # CONFIRMED: CB3 RTDE maximum frequency
reg_started = 20            # ASSUMPTION: 24..47 (reserved for RTDE since 3.9) are missing on PolyScope 3.3.3
reg_done = 21               # (probe 2026-10-06); 0..23 are shared with the fieldbus there. 20..22 read 0 for 2 s on
reg_error = 22              # 2026-10-06 (nothing writes them) - assumed free of fieldbus/PLC use. reg_error: block
                            # error codes (0 none, 1 IK unreachable)
contact_mm = 60.0           # ASSUMPTION: last/first mm at the stone moved at v_contact (= robodk/motion.py engage)
abort_decel = 1.2           # ASSUMPTION: stopl deceleration for an abort [m/s²] (URScript movel default)
block_start_timeout_s = 3.0 # ASSUMPTION: no start marker within this time = compile error (check PolyScope log)
do_grip_close = 1           # CONFIRMED 2026-10-06 (Samuel): the gripper switches on an edge of standard DO0 (open)
do_grip_open = 0            # and DO1 (close; his message said "opens" for both, read as close = DO1 as in Gino's code)
grip_pulse_s = 0.5          # PLACEHOLDER
grip_wait_s = 1.0           # PLACEHOLDER: EHPS-20-A stroke time not looked up
