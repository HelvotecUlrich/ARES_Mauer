# ARES + UR5 brick laying – station parameters (single source for all RoboDK scripts).
# Units: mm, deg. Frame "ARES" = base_link of the MA repo: floor, midpoint between the two steering axes,
# x forward, y left, z up (REP-103). The STEP export 2026-09-23 uses exactly this frame (checked: steering
# mounting plates at x = ±353.6, front scanner at (452.0, 192.0) = ares_geometry.yaml lidar_front).
#
# Status tags:  CONFIRMED = CAD / Samuel / measurement · ASSUMPTION = reasonable choice, no evidence ·
#               PLACEHOLDER = only so the model is valid, must be replaced

[ares]
step_file = "cad/2026-09-23_030718_A_1-AMR_SIM.stp"   # CONFIRMED: NX export 2026-09-23 (Samuel), frame = base_link
steer_axis_x = 353.625      # CONFIRMED: steering axes at ±353.625 mm (PLC FB_AmrKinematics, NX-MCD 2026-09-22)
deck_top_z = 333.6          # CONFIRMED from STEP placement of 030250 Deckplatte (z axis down) – check with ray in RoboDK
length = 1120.0             # CONFIRMED: chassis mesh x ±560 (MCD export 2026-09-22)
width = 600.0               # CONFIRMED: chassis mesh y ±300

[ur5]
robot_file = "robodk/library/UR5.robot"   # RoboDK library, UR5 (CB3), downloaded 2026-10-02
# Mount: "in axis with the front steering module, on top of the robot" (Samuel 2026-10-02).
mount_x = 353.625           # CONFIRMED (axis of the front steering module); exact position follows (Samuel)
mount_y = 0.0               # ASSUMPTION: on the centreline
mount_z = 333.6             # PLACEHOLDER: deck top, no adapter plate; exact height follows (Samuel)
mount_rz = 0.0              # PLACEHOLDER: rotation of the UR base about z [deg]

[tool]
# Gripper "Backengreifer" (Festo EHPS-20-A + ribbed jaws) taken from Gino's RoboDK station UR5_sim_v3.rdk (2026-10-02).
# Tool frame: z along the flange axis, y = closing direction of the jaws, TCP = top centre of the held stone.
tool_file = "cad/gripper_backengreifer_gino.tool"
tcp_z = 147.0               # = 135 (Gino UR5_sim_v3.rdk, flange -> stone top centre; older test.urp: 155) + adapter_z.
                            # ASSUMPTION: TCP = stone top centre; without Bota SensONE (+35 mm if it is mounted)
adapter_z = 12.0            # CONFIRMED: camera adapter plate 018660_A_1 between flange and gripper, z 0..12 (STEP
                            # 2026-10-05) -> gripper geometry and TCP move +12 mm along the flange z axis

[brick]
# Full stone "Kompletter_Stein" (CAD 2026-10-01, cad/stone_full_2026-10-01.step): CONFIRMED from CAD.
mesh = "cad/stone_full_2026-10-01.stl"   # stone frame: x 0..120 (width, ribbed faces), y -200..0 (length), z 0..120
length = 200.0
width = 120.0
height = 120.0              # course pitch, assuming the pins seat fully (CAD: pins 23.5 mm, sockets 22.5 mm deep -> check)
pin_length = 23.5
head_joint = 0.0            # dry-stacked, interlocking
bed_joint = 0.0
rib_mm = 1.69               # CONFIRMED (CAD): horizontal ribs on both long faces, full length, 1.6858 mm high (mesh bbox
                            # x -1.6858..121.6858, checked 2026-10-05) -> width over the ribs 123.37 mm; end faces flat
mass_kg = 0.0               # UNKNOWN: volume 2880 cm3 (CAD mesh, consistently oriented; the raw STL has 516 of 1980
                            # faces flipped and gave 2270 - wrong). Concrete ~2.3 g/cm3 would give ~6.6 kg > UR5 payload
                            # 5 kg -> check the STEP volume and weigh a stone

[half_brick]
# Half stone (Samuel 2026-10-05: "half stones will go on the end and maybe also the corners"): closes the odd courses
# at both leg ends, so every leg is a rectangle (robodk/wallplan.py layout_leg). The CAD of the CURRENT half stone is not
# available: Gino's archive half stone (reference/2026-10-02_Gino/CAD/Halber Stein/Halber_Stein-Body.step) is the OLD
# design (147 x 120 x 183 mm incl. 15 mm pins, measured 2026-10-05) and does not match the current full stone
# (123 x 200 x 143.5 mm incl. ribs and 23.5 mm pins). Everything here is derived from the full stone until the real
# half stone is measured. Pin pattern of the full stone (cad/stone_full_2026-10-01.stl, checked 2026-10-05): 4 pins,
# 100.5 mm along (y -49.75 / -150.25) x ~53 mm across.
length = 100.0              # PLACEHOLDER: half of [brick] length = bond offset (a rectangle needs exactly this)
width = 120.0               # PLACEHOLDER: = [brick] width
height = 120.0              # PLACEHOLDER: = [brick] height (course pitch)
pin_across = 53.0           # PLACEHOLDER: ONE pin pair centred along the length, 53 mm apart across (x 33.5 / 86.5 of
                            # the width, same cones as the full stone), ONE socket pair on top at the same place. On the
                            # end of a full stone its pins meet the full stone's end socket pair 0.25 mm off (50 vs
                            # 100 - 50.25 = 49.75 mm from the end), inside the ~10 mm capture range
pin_length = 23.5           # PLACEHOLDER: = [brick] pin_length
mass_kg = 0.0               # UNKNOWN: like the full stone (CAD volume of the current half stone unknown)

[wall]
side = "front"              # Samuel 2026-10-02: wall on the short (front) edge of ARES, ARES moves sideways (+y)
courses = 4                 # CONFIRMED: Samuel 2026-10-05 (4 stones high); was 3 (PLACEHOLDER)
bond_offset = 0.5           # running bond, half a stone (100 mm) = pin spacing of the stone
base_z = 20.0               # PLACEHOLDER: first course stands on a 20 mm base plate with sockets (the existing plates
                            # are for the older 144 mm stone)
dist_nominal = 840.0        # CONFIRMED: Samuel 2026-10-06, ARES farther from the wall (was 740 = reach study 2026-10-02, the plates
                            # then ended 10 mm before the ARES front). 840: ARES front 220 mm from the wall face, 110 mm
                            # from the board plates; top-course reach +-600 mm (+-660 at 740, RoboDK reach table); the C
                            # still needs 5 stops (study 2026-10-06: same placement error, no plate contact in 10 world
                            # simulations, 9 ARES moves between stops instead of 16)
u_from = -900.0             # nominal wall drawn along the wall, wall frame [mm] – station view only
u_to = 1800.0
shape = "C"                 # CONFIRMED: Samuel 2026-10-06 ("make it a small C, one length is 2m, then 1.5 across and 1m
                            # back"; before: the L of 2026-10-05); the legs below; without [[wall.legs]] the wall is
                            # straight (tools/make_job.py --length N)
half_stones = true          # CONFIRMED: Samuel 2026-10-05 (half stones on the ends) -> every leg is a rectangle
ares_inside = true          # CONFIRMED: Samuel 2026-10-06 ("place the robot on the inside of the C", "put the stones on
                            # the side of ARES as well, then we dont have to make it so wide"): ARES works INSIDE the
                            # corners - the legs turn towards its side; per leg side / dist below
corner_gap_mm = 1.0         # ASSUMPTION: every corner, gap between the next leg's flat end face and the rib crests of
                            # the earlier leg's inside face (stone tolerance; corner detail to be confirmed with Gino /
                            # Samuel). The next leg's base blocks are set this far + [brick] rib_mm off the earlier's
reach_margin_mm = 20.0      # ASSUMPTION: legs plan - a stone counts as reachable from a stop only if every reach-table
                            # point within +-20 mm is ok (= [sequencer] stop_tol_mm: ARES may stand that far off the
                            # nominal stop after the closed loop). The straight-wall plan (simulate.py) keeps 0

# Legs of the C (robodk/wallplan.py legs / butt_corner, tools/plan_layout.py). Wall frame = leg A frame, y towards
# ARES. ARES works INSIDE the C (Samuel 2026-10-06) and never turns there: it drives in through the open side facing
# leg B (heading 0 in the wall frame) and builds A on its RIGHT (side wall), B in FRONT, C on its LEFT (side wall),
# then backs out (also for every station trip). Every next leg is perpendicular at the far end of the one before, on
# its ARES side: the earlier leg runs through the corner (its course-0 end flush with the BODY of the next leg's outer
# face), the next leg starts at its ARES-side face - a vertical BUTT joint in every course (the 53 x 100.5 mm pin
# pattern is not square: a stone turned by 90 deg never engages the sockets below). That face carries the ribs, so the
# next leg's flat end face stands rib_mm + corner_gap_mm off the body: frame = T_wall_prev @ transl(length * n0_prev -
# width / 2, +(width / 2 + rib_mm + corner_gap_mm), 0) @ rotz(+90 deg) (wallplan.butt_corner towards_ares).
# Lengths (Samuel 2026-10-06: "2m, then 1.5 across and 1m back"): A 10, B 7, C 5 stones; 1.52 m over the outer faces
# of A and C, 1.28 m between their inside faces (ARES is 0.6 m wide; 1.12 m long - with the wall in front of ARES it
# did not fit, study 2026-10-06). side / dist: on which side of ARES the leg is built and ARES centre -> leg centreline
# (RoboDK reach table per side; side walls at 580 mm = ARES side 110 mm from the board plates, like the front at 840).
# ARES stops only where it keeps [routes] clearance_mm from the other legs and their plates (tools/make_job.py
# stop_limits: on B 460..820 mm). Status: lengths, inside and the sides CONFIRMED (Samuel), corner design and the
# distances ASSUMPTION.
[[wall.legs]]
name = "A"
n0 = 10                     # CONFIRMED: Samuel 2026-10-06 ("one length is 2m")
xyz_in_wall = [0.0, 0.0, 0.0]          # ASSUMPTION: leg A frame = wall frame (definition)
rpy_in_wall_deg = [0.0, 0.0, 0.0]
side = "right"              # CONFIRMED: Samuel 2026-10-06 (wall on the side of ARES inside the C)
dist = 580.0                # ASSUMPTION: ARES side 110 mm from the board plates (170 mm from the leg centreline)
[[wall.legs]]
name = "B"
n0 = 7                      # CONFIRMED: Samuel 2026-10-06 ("1.5 across": 1.52 m over the outer faces)
xyz_in_wall = [1940.0, 62.69, 0.0]     # ASSUMPTION: butt corner at A's far end towards ARES (200 * 10 - 60, 60 + 1.69 + 1.0)
rpy_in_wall_deg = [0.0, 0.0, 90.0]
side = "front"              # CONFIRMED: Samuel 2026-10-06 (B straight ahead of ARES driving into the C)
dist = 840.0                # CONFIRMED: Samuel 2026-10-06 (front wall 840 mm, see [wall] dist_nominal)
[[wall.legs]]
name = "C"
n0 = 5                      # CONFIRMED: Samuel 2026-10-06 ("1m back")
xyz_in_wall = [1877.31, 1402.69, 0.0]  # ASSUMPTION: butt corner at B's far end towards ARES (B + (-62.69, 200 * 7 - 60))
rpy_in_wall_deg = [0.0, 0.0, 180.0]
side = "left"               # CONFIRMED: Samuel 2026-10-06 (wall on the side of ARES inside the C)
dist = 580.0                # ASSUMPTION: as leg A

[deck]
holder_z = 20.0             # PLACEHOLDER: stones on the deck stand in a 20 mm holder with sockets. ASSUMPTION: every
                            # holder also takes a half stone centred on the slot (needs a socket pair at the slot centre;
                            # in the full-stone sockets it would sit 50.25 mm off-centre)
layers = 2                  # PLACEHOLDER: stacked layers in the magazine (reach_study.py deck grid)
magazine_rows_dx = [-653.6, -433.6]  # ASSUMPTION: magazine rows, x relative to the UR base [mm] (robodk/simulate.py:36)
magazine_y = [-205.0, 0.0, 205.0]    # ASSUMPTION: stone centres along ARES y [mm] (robodk/simulate.py:37)
magazine_layers = 3         # ASSUMPTION: layers per magazine stack as simulated (robodk/simulate.py:36; differs
                            # from layers = 2 above, which only drives the reach-study grid)

[camera]
# Eye-in-hand camera on the tool flange beside the gripper, looking along the tool z axis (Samuel 2026-10-02). It
# looks at markers to reference (1) the place positions at the wall and (2) the fixed pick-up station where ARES reloads
# its deck magazine when empty – ARES alone is not accurate enough (drive error, wheel slip). Not modelled in RoboDK yet.
# Sources: IDS shop / 1stVision IDS uEye manual (GigE uEye CP Rev. 2.2) / INOSAKI lens pages, read 2026-10-02.
model = "IDS GV-51F0CP-M-GL Rev.2.2"  # CONFIRMED: Samuel 2026-10-02; Sony IMX547, mono, global shutter, GigE, C-mount
res_x = 2472                # CONFIRMED datasheet [px]
res_y = 2064                # CONFIRMED datasheet [px]
pixel_um = 2.74             # CONFIRMED datasheet [µm] -> active area 6.77 × 5.66 mm, diagonal 8.82 mm
body = [29.0, 29.0, 29.0]   # CONFIRMED datasheet: housing W × H × D [mm], IP30; mass not in the datasheets read
power_max_w = 4.2           # CONFIRMED datasheet (1.5–4.2 W). Supply: PoE (IEEE 802.3af/at) OR 12–24 V DC on the 8-pin
                            # Hirose HR25 (pin 8 VCC, pin 1 GND) – never both at once (IDS: can destroy the camera)
lens = "IDS-12M23-C1228"    # CONFIRMED: Samuel 2026-10-02; 2/3" image circle, 12 MP, F2.8–16, no IR correction,
                            # Ø29 × 47.6 mm, 90 g (IDS shop listing); chosen over IDS-8M118-C1220 (same 12 mm, 1/1.8")
focal = 12.0                # CONFIRMED datasheet [mm] -> field of view 31.5° × 26.5° on this sensor
lens_mod = 80.0             # CONFIRMED datasheet: minimal object distance [mm]
working_dist = 320.0        # ASSUMPTION: lens -> marker [mm]; 181 × 151 mm field, 0.073 mm/px. CONFIRMED 2026-10-06
                            # (Samuel, table test): focus set on the calib board at ~320 mm from the lens front (ruler),
                            # iris F5.6, both rings locked; reference frame data/cam_check/live/
                            # live_2026-10-06_153031.png. Changing them = new intrinsics + hand-eye calibration
power = "UR tool connector, 24 V"  # ASSUMPTION (recommendation 2026-10-02): max 600 mA (UR5 manual 1.9.4), camera
                            # ≈ 0.18 A at 24 V. The gripper EHPS-20-A (max 2 A at 24 V) cannot run from it.
ip = "192.168.1.5"          # CONFIRMED 2026-10-06 (table test, Samuel): opened and grabbed at this IP. Collides with
                            # the ARES subnet 192.168.1/24 (MA 10_robot/ipc_c6030/IP_CONFIG_erwan.md, also 192.168.200/24,
                            # 169.254/16) -> move it to its own subnet (ids_ipconfig) before it goes on ARES
serial = "4110073444"       # CONFIRMED: IDS peak 26.06.2 enumeration 2026-10-05, the only IDS camera attached (model
                            # string "GV-51FxCP-M", MAC 00:1B:A2:21:21:13) – check against the camera label
cti_path = ""               # "" = GENICAM_GENTL64_PATH, then the IDS install folder; on this laptop (CONFIRMED
                            # 2026-10-05): C:\Program Files\IDS\ids_peak\ids_gevgentl\64\ids_gevgentlk.cti
timeout_ms = 3000           # ASSUMPTION: grab timeout after the software trigger (exposure + ~45 ms GigE transfer)
packet_size = "auto"        # ASSUMPTION: "auto" keeps the size the IDS GenTL negotiated (largest the network supports),
                            # "max" = camera maximum (only if the NIC jumbo size is >= it), or a value in bytes
n_buffers = 3               # ASSUMPTION: acquisition buffers (software trigger, one frame at a time)
load_default_userset = true # ASSUMPTION: load the camera user set "Default" on open (known state), then apply the above
pixel_format = "Mono8"      # ASSUMPTION: 5.1 MB per frame, ~45 ms on GigE, enough for the marker work
exposure_us = 76354.0       # CONFIRMED 2026-10-06 (Samuel, cam_check live): F5.6, lab light at the table, no pixel
                            # saturated. Long: images only with the arm still; the light on ARES will differ
gain = 1.0                  # PLACEHOLDER
settle_s = 2.0              # PLACEHOLDER: wait after the arm stops before the image – Heini thesis needed 2 s for a
                            # vibrating mount; ARES sway on the sprung casters not measured yet

[camera.mount]
# T_flange_cam: camera frame (OpenCV: z = optical axis, x = image right, y = image down, origin = projection centre) in
# the UR5 flange frame. Design value of the adapter 018660_A_1 (input/kamerahalter_handoff.md): optical axis at
# x = -150, y = 0 along +z, lens front z = 60 (C-mount ring 5.0 mm ASSUMPTION), C-mount flange z = 12.39 -> projection
# centre 17.526 - 12 = 5.5 mm behind it (thin lens, ASSUMPTION). Camera bottom face (4 x M3) screwed to the wall on +y
# -> image down = flange +y (ASSUMPTION: sensor upright in the housing). The real value comes from the hand-eye
# calibration (calib/handeye.json).
# Orientation CONFIRMED 2026-10-06 (table test, tools/measure_target.py mount, two 10 mm base translations, nominal
# intrinsics, report data/mount_check/mount_2026-10-06.json): image right = flange +x, image down = flange +y, optical
# axis = flange +z, measured 3.4 deg from rpy_deg below (within the check's accuracy); calib board flat on the table
# 0.9 deg from the nominal optical axis. The position (xyz) is not checked by it - hand-eye calibration.
# Hand-eye 2026-10-06 (calib/handeye.json, tools/calib_handeye.py orbit, run 2, 25 views): xyz (-149.5, 3.0, 46.2) mm,
# rpy (-1.14, 0.46, -0.42) deg; hold-out 0.85 mm / 0.48 deg rms. Run 3 (same views again): 0.05 mm / 0.006 deg from
# run 2 (noise negligible). Run 1 (other views, before the camera adapter touched wrist 1): 3.0 mm / 0.4 deg off with
# the same intrinsics - a shift by the contact or a pose-set dependent systematic error; open (needs a run from
# another start pose). z = 46 vs 6.9 here: the design's thin-lens guess of the projection centre, not a mount error.
xyz = [-150.0, 0.0, 6.86]   # ASSUMPTION (design)
rpy_deg = [0.0, 0.0, 0.0]   # ASSUMPTION (design)

[camera.adapter]
step_file = "cad/camera_adapter_018660_A_1.stp"  # CONFIRMED: NX2512 export 2026-10-05 (Samuel), in the UR flange frame:
                            # bbox x -168..31.5, y -31.3..31.3, z -24..12 (RoboDK import 2026-10-05); printed part,
                            # no-sleeve test variant (handoff: retighten M6 after 1 h and 24 h, calibrate after 24-48 h)
mass_kg = 0.16              # ASSUMPTION: handoff estimate for PETG at 100 % infill (125.8 cm³)

[vision]
# Free OpenCV pipeline (no HALCON): ChArUco boards, solvePnP (IPPE + LM refine), cv2.calibrateHandEye (PARK).
opencv = "4.14.0.94"        # CONFIRMED pin (research 2026-10-05): 5.0.0.93 has no calibrateHandEye in Python,
                            # <= 4.13 shifts ChArUco corners by 0.5 px
intrinsics_file = "calib/camera_intrinsics.json"
handeye_file = "calib/handeye.json"
min_corners = 8             # ASSUMPTION: minimum ChArUco corners for a board pose
max_reproj_px = 1.0         # ASSUMPTION: reject a board pose with a larger RMS reprojection error
border_px = 10              # ASSUMPTION: ignore corners closer to the image border (partial-tag outliers)
calib_min_corners = 12      # ASSUMPTION: minimum ChArUco corners per intrinsics view
holdout_every = 5           # ASSUMPTION: hand-eye validation holds out every 5th pose (research: 5–10 hold-out poses)
max_qd_rad_s = 0.01         # ASSUMPTION: drop images taken while a joint moved faster (0.01 rad/s · 10 ms · 1 m = 0.1 mm)

[vision.handeye_plan]
# Look poses around the deck-fixed calib board (research 2026-10-05: >= 20 poses, large relative rotations).
n_poses = 25                # ASSUMPTION
dist_mm = [290.0, 355.0]    # ASSUMPTION: inside the depth of field around the 320 mm focus distance
tilt_deg = [15.0, 30.0]     # ASSUMPTION
roll_deg = [-90.0, 90.0]    # ASSUMPTION
min_clearance_mm = 50.0     # ASSUMPTION: plan warns when arm/camera points come closer to the deck plane (rough DH check)

# ChArUco boards. Board frame = OpenCV 4.14 CharucoBoard frame: origin at the top-left outer corner of the printed
# board, x to the right, y down, z into the board (checked 2026-10-05: corner 0 at (square, square, 0)).
# tools/print_targets.py prints origin and axes on every sheet. Print as vector PDF at 100 % on a rigid flat plate,
# then measure the square size over the whole board and enter it (0.1 % scale error = 0.32 mm depth at 320 mm).
[boards.calib]
# Intrinsics and hand-eye board; fixed on the ARES deck for the hand-eye calibration so ARES sway cancels out.
squares_x = 11
squares_y = 8
square_mm = 15.0            # CONFIRMED 2026-10-06 (Samuel measured the printed calib board)
marker_mm = 11.0            # PLACEHOLDER: nominal
dictionary = "DICT_5X5_100"
first_id = 0
xyz = [-232.5, 60.0, 336.6] # PLACEHOLDER: board origin in the ARES frame during the hand-eye calibration (face up,
rpy_deg = [180.0, 0.0, 0.0] # centre at ARES x = -150, y = 0, on a 3 mm plate on the deck, 504 mm behind the UR axis:
                            # 100 % of 250 planned look poses have a UR5 IK solution vs 94 % at x = 0 (calib_handeye
                            # scan 2026-10-05). Lies on magazine row 1 -> calibrate with an empty magazine

[boards.ref]
# Reference boards at the wall and the pick-up station: 10 AprilTag markers each, own id range per board
# (targets.first_id). Research 2026-10-05 (synthetic): lateral ~0.03 mm, tilt <= 0.06°, yaw <= 0.003°.
squares_x = 5
squares_y = 4
square_mm = 16.0            # PLACEHOLDER: nominal, replace with the measured print size
marker_mm = 12.0            # PLACEHOLDER: nominal
dictionary = "DICT_APRILTAG_36h11"

# Reference board placements: board origin and orientation in the parent frame. parent = "wall" (wall frame,
# robodk/rdk_common.py), "station" ([pickup_station] frame) or "deck" (ARES frame). A wall board with `leg = "A"/"B"`
# gives xyz / rpy_deg in that LEG's frame ([[wall.legs]]; mauer/reference.py placements composes T_wall_leg @ pose).
# Wall boards (Samuel 2026-10-05): printed board glued on a 4 mm MDF plate lying face up on the floor on the ARES side
# of a leg; the plate's notched edge rests against the side faces of that leg's female-pin base blocks of course 0 and
# two V-notches line up with the joints of one block ([plates], tools/make_plates.py) -> the board centre sits on a block
# centre: u = 100 + 200 k (k = block index from the leg start, k < 0 / k >= n0 = spare block beyond a free leg end),
# v = block face 60 + 55 = 115 mm. Origin = top-left board corner -> (u - 40, 115 + 32, MDF 4 + paper 0.1) in the leg
# frame. The positions follow from the PLACEHOLDER block size in [plates].
# C layout 2026-10-06, ARES inside (tools/plan_layout.py --evaluate, results/l_wall_plan.md; the L layout of
# 2026-10-05 in tests/conftest.py L_BOARDS): the 8 existing boards (Samuel: no new markers / boards; the engraved
# "u = ..." on the plates is now wrong, the names/ids are what count) on the INSIDE faces of the legs (ARES side), no
# spare block, plates clear of each other, the other legs, ARES at its stops and the routes. A stop only looks at
# boards of its OWN leg, with looks clear of the wall built by the end of the stop, of the ARES chassis and of a full
# magazine (tools/make_job.py, mauer.armcheck; RoboDK 2026-10-06: looks to boards behind the UR5 hit the full
# magazine, looks beside ARES put the gripper into it): A 4 boards, B 2, C 2 -> 3, 2, 2, 2, 2 usable boards at the 5
# stops (+-50 mm ARES margin and the arrival standoff), worst baseline 600 mm. Boards of legs B / C are in their leg frame, so they follow the corner
# offsets (rib + corner gap).
[[targets]]
name = "W0"
parent = "wall"
leg = "A"                   # block k = 1 of leg A (u 300)
first_id = 30
xyz = [260.0, 147.0, 4.1]
rpy_deg = [180.0, 0.0, 0.0]
[[targets]]
name = "W1"
parent = "wall"
leg = "A"                   # block k = 3 (u 700)
first_id = 40
xyz = [660.0, 147.0, 4.1]
